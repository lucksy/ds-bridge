name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install (locked)
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test with coverage
        # Coverage gate (>=90% lines on src/engines) activates automatically in
        # vitest.config.ts once src/engines exists (Phase 1).
        run: npm run test:coverage

      - name: Build bundle
        run: npm run build

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Plugin validate (strict)
        run: npx --yes @anthropic-ai/claude-code plugin validate . --strict
