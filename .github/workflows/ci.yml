name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # T4.7 — nightly + on-demand triggers drive the gated live Figma smoke test
  # (figma-smoke job below). The push/PR triggers above run only the `check`
  # job; the smoke job self-skips on those events (see its `if`).
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install (locked)
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test with coverage
        # Coverage gate (>=90% lines on src/engines) activates automatically in
        # vitest.config.ts once src/engines exists (Phase 1).
        run: npm run test:coverage

      - name: Build bundle
        run: npm run build

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Plugin validate (strict)
        run: npx --yes @anthropic-ai/claude-code plugin validate . --strict

  # W1.5 — website deploy to Cloudflare Pages (project: ds-bridge). Runs on
  # push to main (production, --branch=main) and on PRs (per-branch preview
  # deployment URLs), always AFTER the check job passes — a red suite never
  # deploys. Same self-skip pattern as e2e: GitHub can't use `secrets` in `if`,
  # so the deploy STEP exits 0 with a notice until CLOUDFLARE_API_TOKEN is
  # configured (CLOUDFLARE_ACCOUNT_ID is a repo secret set at W1.5 hookup).
  # First-ever production deploy may also come from a local `wrangler pages
  # deploy` — the job is idempotent either way.
  deploy-website:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install website (locked)
        run: npm ci --prefix website

      - name: Build static export
        run: npm run build --prefix website

      - name: Deploy to Cloudflare Pages (skips without CLOUDFLARE_API_TOKEN)
        # main push -> production; PR -> preview deployment for the head branch.
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "skipped (no CLOUDFLARE_API_TOKEN secret configured — see TASKS.md W1.5)"
            exit 0
          fi
          BRANCH="${{ github.event_name == 'pull_request' && github.head_ref || 'main' }}"
          npx --yes wrangler pages deploy website/out \
            --project-name=ds-bridge --branch="$BRANCH"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # T4.7 — gated live Figma smoke test (fixture-drift detection). Runs nightly
  # (cron above) and on manual workflow_dispatch ONLY — never on push/PR (the
  # `if` keeps it off PR/branch runs). Gating is by SELF-SKIP: the secrets are
  # passed through as env, and e2e/figma-smoke.test.ts uses describe.skipIf to
  # report the suite as *skipped* (not failed) when FIGMA_TOKEN / SMOKE_FILE_KEY
  # are absent or empty. So this job stays green whether or not the secrets are
  # configured — no `if: secrets.*` expression needed (and GitHub does not
  # support `secrets` in step/job `if` anyway). Wired to release checkpoints
  # C4–C6 + nightly so fixture drift surfaces before production.
  figma-smoke:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install (locked)
        run: npm ci

      - name: Live Figma smoke (self-skips without secrets)
        # No package.json script (T4.7 owns no package.json edit): invoke vitest
        # directly with the dedicated e2e config. Self-skips when the secrets are
        # absent, so the step exits 0 either way. View-seat rate limits are
        # tolerated inside the test (logged warning, not a failure).
        run: npx vitest run --config vitest.e2e.config.ts e2e/figma-smoke.test.ts
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
          SMOKE_FILE_KEY: ${{ secrets.SMOKE_FILE_KEY }}

  # T6.2 — headless E2E suite (plugin loads + lint hook fires in a real
  # `claude -p` session). Runs nightly (cron above) and on manual
  # workflow_dispatch ONLY — never on push/PR (same `if` gate as figma-smoke).
  #
  # Self-skip semantics differ from figma-smoke. The tests gate on DS_BRIDGE_E2E
  # (describe.skipIf), but DS_BRIDGE_E2E=1 + no auth would make `claude -p` fail
  # auth → RED, not skip. So the test STEP is gated in shell on ANTHROPIC_API_KEY:
  # when the secret is absent the step prints "skipped (no key)" and exits 0
  # (GitHub does not support `secrets` in step/job `if`). With the key present,
  # both DS_BRIDGE_E2E and ANTHROPIC_API_KEY are exported and the suite runs for
  # real (plugin-load uses `--bare`; lint-hook never does — `--bare` skips hooks).
  e2e:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install (locked)
        run: npm ci

      - name: Build bundle
        # The lint hook spawns dist/cli.mjs, so the bundle must exist before the
        # headless run exercises it.
        run: npm run build

      - name: Headless E2E (skips without ANTHROPIC_API_KEY)
        # No package.json script (T6.2 owns no package.json edit): invoke vitest
        # directly with the dedicated e2e config. The shell guard makes a missing
        # key a clean skip (exit 0) instead of a live-auth RED.
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "skipped (no ANTHROPIC_API_KEY secret configured)"
            exit 0
          fi
          npx vitest run --config vitest.e2e.config.ts \
            e2e/plugin-load.test.ts e2e/lint-hook.test.ts
        env:
          DS_BRIDGE_E2E: "1"
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
